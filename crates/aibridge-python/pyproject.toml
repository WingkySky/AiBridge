[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
# PyPI 分发名：aibridge（已被他人占坑注册零文件空项目，无法使用），
# 改用 aibridge-sdk 发布。注意 module-name 仍为 aibridge，import 语句不受影响：
#   pip install aibridge-sdk && import aibridge
name = "aibridge-sdk"
description = "AIBridge - 跨语言多模态 AI 统一接口 SDK（Rust 核心，一套 API 调用 38+ provider：chat/image/video/embed/TTS/ASR）"
# PyPI 搜索与依赖解析只认本文件；README 展示取根目录双语文档
readme = "../../README.zh-CN.md"
requires-python = ">=3.10"
license = { file = "../../LICENSE" }
authors = [{ name = "WingkySky" }]
keywords = ["ai", "llm", "sdk", "chat", "video-generation", "multimodal", "openai", "rust"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/WingkySky/AiBridge"
Repository = "https://github.com/WingkySky/AiBridge"
Changelog = "https://github.com/WingkySky/AiBridge/blob/main/CHANGELOG.md"
Documentation = "https://github.com/WingkySky/AiBridge/tree/main/docs"

[tool.maturin]
# lib name 为 `_aibridge`（见 Cargo.toml [lib] name），故 Rust pymodule 函数名也是
# `_aibridge`（生成 `PyInit__aibridge` 符号）。通过 `module-name` 把它映射到 Python
# 顶层模块 `aibridge`，使 `import aibridge` 正常工作，同时 cdylib 产物名为
# `lib_aibridge.dylib`（macOS）/ `lib_aibridge.so`（Linux），不与 aibridge-ffi 的
# `libaibridge.dylib` 冲突。
module-name = "aibridge"
features = ["pyo3/extension-module"]
